name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Run unit tests
        run: gradle --no-daemon testLiteDebugUnitTest testFullDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleLiteDebug assembleFullDebug

      - name: Upload Lite APK
        uses: actions/upload-artifact@v4
        with:
          name: Glazouh-lite-debug
          path: app/build/outputs/apk/lite/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Full APK
        uses: actions/upload-artifact@v4
        with:
          name: Glazouh-full-debug
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  publish-alpha:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Prepare Glazouh alpha release 0.1.0-alpha.1' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested APK
        uses: actions/download-artifact@v4
        with:
          pattern: Glazouh-*-debug
          merge-multiple: true
          path: dist

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.1
          target_commitish: ${{ github.sha }}
          name: ГлазУх v0.1.0-alpha.1
          body: |
            ## ГлазУх 0.1.0-alpha.1

            Первая альфа-сборка Android-приложения.

            ### Уже работает в проекте
            - Камера на CameraX и чтение текста рус/английский через локальный Tesseract OCR.
            - Озвучивание распознанного текста через Android TextToSpeech.
            - Экран офлайн-субтитров через системный on-device SpeechRecognizer (Android 12+, если локальный движок доступен).
            - Высококонтрастный интерфейс с крупными элементами управления.

            ### Важно
            - Это ранняя альфа, APK подписан временным Android debug-ключом CI.
            - Не предназначен для установки поверх будущих сборок или для публикации в магазинах.
            - Распознавание лекарств как медицинских данных, банкнот, светофоров, дорожной безопасности и говорящих по личности пока не реализовано.
            - OCR и распознавание речи могут ошибаться; не используйте результат как единственное основание для медицинских или дорожных решений.
          files: dist/*.apk
          prerelease: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
